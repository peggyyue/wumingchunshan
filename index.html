<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xumi Story. · 项目工作台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
/* [编辑区 6] 主题配色 / 圆角 —— 改这里可整站换肤 */
:root{
  --bg:#0d1017; --panel:#141922; --panel2:#1b2130; --panel3:#212939;
  --line:#283040; --line2:#3a4457;
  --txt:#e6e9ef; --txt2:#8d97a8; --txt3:#5a6478;
  --blue:#4d9dff; --green:#3fd07a; --amber:#e5b23c; --red:#ff5f56; --purple:#a880ff;
  --r:9px;
}
html,body{height:100%;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  background:var(--bg);color:var(--txt);font-size:13px;overflow:hidden;}
button{font-family:inherit;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:#2b3444;border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:#3a4457;}
::-webkit-scrollbar-track{background:transparent;}
.hidden{display:none !important;}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}

/* ============ 通用控件 ============ */
.btn{font-size:12px;padding:6px 12px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel2);color:#ccd3e0;cursor:pointer;white-space:nowrap;transition:.15s;}
.btn:hover{background:#252d3d;border-color:var(--line2);}
.btn.pri{background:linear-gradient(135deg,#2f7ce0,#4d9dff);border-color:#4d9dff;color:#fff;font-weight:600;}
.btn.pri:hover{filter:brightness(1.12);}
.btn.pri:disabled{opacity:.55;cursor:default;filter:none;}
.btn.gh{background:transparent;}
.btn.sm{padding:4px 9px;font-size:11.5px;}

.chip{font-size:11.5px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);
  background:var(--panel2);color:#b9c2d2;cursor:pointer;transition:.13s;user-select:none;}
.chip:hover{border-color:var(--line2);color:var(--txt);}
.chip.on{background:#1e3050;border-color:var(--blue);color:#cfe4ff;}

.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px;}
.seg button{font-size:11.5px;padding:4px 10px;border-radius:6px;border:0;background:transparent;
  color:var(--txt2);cursor:pointer;transition:.13s;white-space:nowrap;}
.seg button.on{background:#2b3444;color:var(--txt);}

select.sel{font-size:11.5px;background:var(--panel2);border:1px solid var(--line);color:#ccd3e0;
  border-radius:7px;padding:5px 8px;cursor:pointer;outline:none;}

input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;
  background:#2b3444;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;
  background:var(--blue);border:2px solid #0d1017;box-shadow:0 0 0 1px var(--blue);}

.toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,14px);z-index:900;
  background:#202838;border:1px solid var(--line2);border-radius:9px;padding:9px 16px;font-size:12.5px;
  color:var(--txt);box-shadow:0 10px 34px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.22s;}
.toast.show{opacity:1;transform:translate(-50%,0);}
.toast.err{border-color:#6d3030;color:#ffc9c5;}

/* ============ 视图 A：项目 Brief ============ */
#briefView{height:100vh;overflow-y:auto;}
.bnav{position:sticky;top:0;z-index:50;height:52px;background:rgba(13,16,23,.92);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px;}
.bnav .logo{font-size:14px;font-weight:800;letter-spacing:.02em;
  background:linear-gradient(90deg,#4d9dff,#a880ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.bnav .crumb{font-size:12px;color:var(--txt2);}
.bwrap{max-width:1040px;margin:0 auto;padding:26px 24px 80px;}

.hero{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--panel);}
.hero .cover{height:270px;position:relative;background:#161b25;}
.hero .cover img{width:100%;height:100%;object-fit:cover;display:block;}
.hero .cover .fade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,16,23,0) 40%,rgba(13,16,23,.92) 100%);}
.hero .cover .tag{position:absolute;left:16px;top:16px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
  background:rgba(13,16,23,.72);border:1px solid var(--line2);border-radius:5px;padding:4px 8px;color:#cfd7e4;}
.hero .body{padding:16px 20px 20px;}
.hero h1{font-size:24px;font-weight:800;letter-spacing:-.2px;margin-bottom:6px;}
.hero .sub{font-size:12.5px;color:var(--txt2);margin-bottom:12px;}
.hero .desc{font-size:13px;line-height:1.85;color:#c2cadb;max-width:760px;}
.hero .metarow{display:flex;align-items:center;gap:14px;margin-top:16px;flex-wrap:wrap;}
.hero .tags{display:flex;gap:6px;flex-wrap:wrap;}
.hero .tags span{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--panel2);
  border:1px solid var(--line);color:#aab4c6;}
.stat{display:flex;gap:22px;margin-top:18px;padding-top:16px;border-top:1px solid var(--line);}
.stat div b{display:block;font-size:17px;font-variant-numeric:tabular-nums;}
.stat div i{font-style:normal;font-size:11px;color:var(--txt3);}

.sec{margin-top:34px;}
.sec h2{font-size:14px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px;}
.sec h2 em{font-style:normal;font-size:11px;color:var(--txt3);font-weight:400;}
.sec .hint{font-size:11.5px;color:var(--txt3);margin-bottom:14px;line-height:1.7;}

.tl{position:relative;padding-left:22px;}
.tl:before{content:'';position:absolute;left:6px;top:6px;bottom:6px;width:1px;background:var(--line);}
.tl .item{position:relative;padding:0 0 20px;}
.tl .item:before{content:'';position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--panel2);border:2px solid var(--line2);}
.tl .item.done:before{background:var(--green);border-color:#1d5c38;}
.tl .item.now:before{background:var(--blue);border-color:#1e3f6d;box-shadow:0 0 0 4px rgba(77,157,255,.14);}
.tl .t{font-size:12.5px;font-weight:600;margin-bottom:3px;display:flex;gap:8px;align-items:center;}
.tl .t i{font-style:normal;font-size:10px;color:var(--txt3);font-weight:400;}
.tl .d{font-size:12px;color:var(--txt2);line-height:1.75;}

.plist{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:var(--panel);}
.pitem{border-bottom:1px solid var(--line);}
.pitem:last-child{border-bottom:0;}
.pitem .ph{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;transition:.13s;}
.pitem .ph:hover{background:var(--panel2);}
.pitem .no{font-size:11px;color:var(--txt3);width:34px;flex-shrink:0;font-variant-numeric:tabular-nums;}
.pitem .pv{flex:1;font-size:12.5px;color:#c8d0de;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pitem .ar{font-size:10px;color:var(--txt3);transition:.15s;}
.pitem.open .ar{transform:rotate(90deg);}
.pitem .pd{display:none;padding:0 14px 14px 44px;}
.pitem.open .pd{display:block;}
.pitem .pd pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.85;
  color:#b6c0d1;white-space:pre-wrap;word-break:break-word;background:#11151d;border:1px solid var(--line);
  border-radius:8px;padding:11px 12px;}
.pitem .pd .chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px;}
.pitem .pd .plabel{font-size:10.5px;color:var(--txt3);letter-spacing:.05em;margin:11px 0 5px;}
.pitem .pd .plabel:first-child{margin-top:0;}

.wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px;}
.wcard{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);transition:.15s;}
.wcard:hover{border-color:var(--line2);transform:translateY(-2px);}
.wcard .th{height:104px;background:#161b25;}
.wcard .th img{width:100%;height:100%;object-fit:cover;display:block;}
.wcard .nm{padding:8px 10px 10px;}
.wcard .nm b{display:block;font-size:12px;font-weight:600;margin-bottom:2px;}
.wcard .nm i{font-style:normal;font-size:10.5px;color:var(--txt3);}
.wgroup{margin-bottom:20px;}
.wgroup h3{font-size:11px;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase;margin-bottom:9px;}

/* ============ 视图 B：Studio 三栏 ============ */
#studioView{height:100vh;display:flex;flex-direction:column;}
.topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;z-index:60;}
.topbar .logo{font-size:13.5px;font-weight:800;background:linear-gradient(90deg,#4d9dff,#a880ff);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbar .logo[data-act]{cursor:pointer;}
.topbar .logo[data-act]:hover{opacity:.72;}
.topbar .pname{font-size:12px;color:#ccd3e0;font-weight:600;}
.topbar .sp{flex:1;}
.av{width:24px;height:24px;border-radius:50%;background:linear-gradient(135deg,#3d5f9e,#a880ff);
  border:1.5px solid var(--panel);margin-left:-7px;display:flex;align-items:center;justify-content:center;
  font-size:10px;color:#fff;font-weight:700;}
.avs{display:flex;padding-left:7px;}
.cred{font-size:11px;color:var(--txt2);background:var(--panel2);border:1px solid var(--line);
  border-radius:20px;padding:4px 10px;font-variant-numeric:tabular-nums;}
.cred b{color:var(--txt);}

/* ============ 视图 B：Xumi Story 工作台（文件树 + 素材详情） ============ */
.work{display:flex;flex:1;min-height:0;}

/* --- 左侧文件树 --- */
.tree{width:256px;background:var(--panel);border-right:1px solid var(--line);display:flex;
  flex-direction:column;flex-shrink:0;overflow-y:auto;padding:10px;}
.tproj{display:flex;align-items:center;gap:10px;padding:8px 8px 14px;}
.tproj .tav{width:38px;height:38px;border-radius:50%;overflow:hidden;background:var(--panel2);
  border:1px solid var(--line2);flex-shrink:0;}
.tproj .tav img{width:100%;height:100%;object-fit:cover;display:block;}
.tproj .tn{min-width:0;}
.tproj .tn b{display:block;font-size:13.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tproj .tn i{font-style:normal;font-size:10px;color:var(--txt3);display:block;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.titem{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:12.5px;
  color:#c3cad8;cursor:pointer;transition:.13s;user-select:none;}
.titem:hover{background:var(--panel2);}
.titem.on{background:#1e2836;color:#fff;}
.titem .ico{width:18px;text-align:center;flex-shrink:0;}
.titem .tl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.titem .tc{font-size:10.5px;color:var(--txt3);font-variant-numeric:tabular-nums;}
.thd{padding:14px 10px 6px;font-size:10px;color:var(--txt3);letter-spacing:.08em;text-transform:uppercase;}
.tfoot{margin-top:auto;padding:12px 10px 4px;font-size:10px;color:var(--txt3);border-top:1px solid var(--line);line-height:1.7;}

/* --- 右侧文件展示区 --- */
.farea{flex:1;min-width:0;overflow-y:auto;padding:16px 18px 26px;
  background:radial-gradient(circle at 1px 1px,#1a202b 1px,transparent 0) 0 0/22px 22px;}
.fhead{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;}
.fhead b{font-size:15px;}
.fhead span{font-size:11px;color:var(--txt3);}
.fhead .sp{flex:1;}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;}
.fcard{border:1.5px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel);
  cursor:pointer;transition:.15s;}
.fcard:hover{border-color:var(--line2);transform:translateY(-2px);}
.fcard .th{height:112px;background:#161b25;position:relative;}
.fcard .th img{width:100%;height:100%;object-fit:cover;display:block;}
.fcard .vtag{position:absolute;right:6px;bottom:6px;font-size:9.5px;background:rgba(13,16,23,.82);
  border-radius:4px;padding:1px 6px;color:#dfe5ef;}
.fcard .nm{font-size:11.5px;padding:7px 9px 2px;color:#dde3ee;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap;}
.fcard .md{font-size:10px;padding:0 9px 8px;color:var(--txt3);}
.fempty{padding:70px 0;text-align:center;color:var(--txt3);font-size:12px;}
.fempty .plan{margin-top:10px;font-size:11.5px;color:var(--txt2);line-height:1.9;}
.titem .tw{width:14px;flex-shrink:0;text-align:center;font-size:10px;color:var(--txt3);line-height:1;}
.titem .tw:hover{color:var(--blue);}
.titem .tw.blank{visibility:hidden;}
.fdoc{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:10px;padding:12px;background:linear-gradient(135deg,#1a2230,#121822);}
.fdoc .dext{font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--blue);
  border:1px solid var(--line2);border-radius:5px;padding:2px 7px;background:var(--panel2);}
.fdoc .dname{font-size:11px;line-height:1.6;color:#c9d2e0;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.docfull{flex:1;min-height:0;overflow:auto;padding:16px 18px;margin:0;
  font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.85;
  color:#c9d2e0;white-space:pre-wrap;word-break:break-word;}
.faudio{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;
  gap:8px;padding:12px;background:linear-gradient(135deg,#1b2a28,#111b1c);}
.faudio .aico{font-size:25px;line-height:1;color:var(--green);}
.faudio .aname{font-size:11px;line-height:1.6;color:#c9d2e0;word-break:break-all;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.daudio{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:16px;padding:24px;
  background:radial-gradient(circle at 50% 40%,#1a2a2b,#0a0d13);}
.daudio .adisc{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:38px;color:var(--green);
  background:linear-gradient(135deg,#1f2f34,#131e22);border:1px solid var(--line2);
  box-shadow:0 0 40px rgba(63,208,122,.12);}
.daudio .atitle{font-size:13px;color:#e6e9ef;}
.daudio audio{width:min(420px,90%);}
@keyframes dbreathe{0%,100%{transform:scale(1);box-shadow:0 0 40px rgba(63,208,122,.12);}
  50%{transform:scale(1.06);box-shadow:0 0 64px rgba(63,208,122,.26);}}
@keyframes dplay{0%{transform:rotate(0deg) scale(1);}
  25%{transform:rotate(90deg) scale(1.04);}
  50%{transform:rotate(180deg) scale(1);}
  75%{transform:rotate(270deg) scale(1.04);}
  100%{transform:rotate(360deg) scale(1);}}
.daudio .adisc{animation:dbreathe 3.2s ease-in-out infinite;}
.daudio.playing .adisc{animation:dplay 8s linear infinite;box-shadow:0 0 56px rgba(63,208,122,.24);}

/* --- 素材详情页 --- */
.detail{display:flex;gap:14px;height:calc(100vh - 80px);}
.dmedia{flex:1;min-width:0;position:relative;display:flex;flex-direction:column;
  background:#0a0d13;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.dmedia img,.dmedia video{flex:1;width:100%;min-height:0;object-fit:contain;display:block;}
.dback{position:absolute;left:10px;top:10px;z-index:5;font-size:11.5px;background:rgba(13,16,23,.8);
  border:1px solid var(--line2);border-radius:6px;padding:4px 10px;color:#dfe5ef;cursor:pointer;}
.dback:hover{border-color:var(--blue);}
.novid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:11px;
  color:var(--txt3);background:rgba(13,16,23,.75);border-radius:6px;padding:4px 10px;}
.dbar{display:flex;align-items:center;gap:10px;padding:9px 12px;background:rgba(16,20,28,.92);
  border-top:1px solid var(--line);font-size:10.5px;color:#cfd7e4;font-variant-numeric:tabular-nums;flex-shrink:0;}
.dbar .sp{flex:1;}
.track{flex:1;height:4px;border-radius:2px;background:#232b38;cursor:pointer;position:relative;}
.track i{position:absolute;left:0;top:0;bottom:0;background:#d3f34b;border-radius:2px;width:0%;}
.dinfo{width:302px;flex-shrink:0;display:flex;flex-direction:column;overflow-y:auto;padding:4px 2px 4px 0;}
.duser{display:flex;align-items:center;gap:9px;padding-bottom:12px;}
.duser .dav{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#3d5f9e,#a880ff);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;}
.duser .dn b{display:block;font-size:12.5px;}
.duser .dn i{font-style:normal;font-size:10px;color:var(--txt3);}
.duser .sp{flex:1;}
.duser .dx{font-size:16px;color:var(--txt3);cursor:pointer;padding:0 6px;}
.duser .dx:hover{color:var(--txt);}
.dsec{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--txt3);letter-spacing:.08em;margin-bottom:8px;}
.dsec span{flex:1;}
.cpy{font-size:10.5px;padding:2px 9px;border-radius:5px;border:1px solid var(--line2);
  background:var(--panel2);color:#cfd7e4;cursor:pointer;}
.cpy:hover{border-color:var(--blue);color:#fff;}
.dprompt{font-size:11.5px;line-height:1.8;color:#c9d2e0;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:10px 11px;max-height:190px;overflow:hidden;word-break:break-word;}
.dprompt.open{max-height:none;}
.dprompt .hl{color:#e4f56a;font-weight:600;}
.dsee{font-size:11px;color:var(--txt3);padding:7px 2px;cursor:pointer;flex-shrink:0;}
.dsee:hover{color:var(--blue);}
.dtable{font-size:11.5px;}
.dtable .row{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);}
.dtable .row:last-child{border-bottom:0;}
.dtable .k{width:70px;color:var(--txt3);flex-shrink:0;}
.dtable .v{color:#d6dce8;word-break:break-word;}
.dl{margin-top:14px;font-size:12.5px;font-weight:700;padding:9px 0;border:0;border-radius:8px;
  cursor:pointer;color:#151a0d;background:#d3f34b;transition:.15s;}
.dl:hover{filter:brightness(1.08);}

/* --- Brief：成片播放器 / 资产卡播放角标 / Skill 文件 --- */
.film{background:#0a0d13;border:1px solid var(--line);border-radius:12px;overflow:hidden;}
.film video{display:block;width:100%;max-height:540px;background:#000;}
.wcard.vclip{cursor:pointer;}
.wcard.vclip .th{position:relative;}
.wplay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:38px;height:38px;border-radius:50%;background:rgba(13,16,23,.74);
  border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;
  color:#e6e9ef;font-size:13px;transition:.15s;}
.wcard.vclip:hover .wplay{border-color:var(--blue);color:#fff;}

.skill{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);
  border-radius:11px;background:var(--panel);padding:14px;}
.sicon{width:46px;height:54px;flex-shrink:0;border-radius:7px;border:1px solid var(--line2);
  background:var(--panel2);display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:var(--txt2);letter-spacing:.05em;}
.sbody{flex:1;min-width:0;}
.sbody b{display:block;font-size:13px;margin-bottom:4px;}
.sbody i{font-style:normal;font-size:11px;color:var(--txt3);display:block;line-height:1.75;}
.sacts{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;}
.sbtn{font-size:11.5px;padding:5px 11px;border-radius:6px;border:1px solid var(--line2);
  background:var(--panel2);color:#d7dfea;cursor:pointer;text-decoration:none;display:inline-block;
  font-family:inherit;}
.sbtn:hover{border-color:var(--blue);color:#fff;}
.sbtn.pri{background:linear-gradient(135deg,#2f7ce0,#4d9dff);border-color:#4d9dff;color:#fff;}
.soutline,.sfull{display:none;margin-top:12px;border-top:1px solid var(--line);padding-top:12px;}
.soutline.open,.sfull.open{display:block;}
.soutline ul{margin:0;padding-left:18px;columns:2;column-gap:24px;}

.stbrief summary:before{content:'▸ ';color:var(--blue);}
.stbrief details[open] summary:before{content:'▾ ';}

@media(max-width:900px){

  .stbrief .apair{flex-direction:column;}

}

const SKILL_MD = "# ACTING SYSTEM\n## Character Performance for AI Video Generation (Seedance 2.0)\n\nYou are reading this because your user generates cinematic AI video and needs\nyou to write **character acting** inside their prompts. Study this document,\nthen apply it every time you write, review, or fix the performance layer of a\nvideo-generation prompt. This file is model-agnostic in format: whatever\nprompt template your user works with, the acting content you produce goes\ninto the motion / character-behavior / performance part of the prompt.\n\n**The core axiom of this entire system: acting is BEHAVIOR under pressure,\nnot a display of emotion.** A character wants something, something is in the\nway, and they act to get it. Emotion is a byproduct of that struggle — never\nthe thing you write directly. Everything below unpacks this rule.\n\n---\n\n# PART I — THE CRAFT: WHAT GOOD ACTING IS\n\n## 1. Definition\n\nActing is truthful behavior under imaginary circumstances (Meisner). Not\ndepicting emotions, not reciting text, not \"expressive faces.\" A person in\nthe frame WANTS something, something INTERFERES, and they ACT to get what\nthey want.\n\n| Bad acting | Good acting |\n|---|---|\n| Shows the emotion (\"I am angry\") | Pursues the objective (\"I will make you return the money\") — anger arises on its own |\n| Waits for their cue | Listens and reacts to the partner every second |\n| Body illustrates the words (gesture = word) | Body lives its own life, sometimes contradicts the words |\n| All lines in one tempo and tone | Rhythm changes with every change of tactic |\n| Emotion switches on at the line and off after | State is continuous — there is a \"life before\" and a \"life after\" the line |\n| The face \"performs\" — eyebrows, grimaces | The face thinks — the thought is readable in the eyes before the words |\n\n## 2. The five pillars of every scene\n\nEvery character in every scene decomposes into five elements. If even one is\nmissing, the performance falls apart.\n\n**2.1 Objective.** What the character wants IN THIS SCENE, RIGHT NOW, FROM A\nSPECIFIC PERSON. Always a verb aimed at the partner: \"make him confess\",\n\"beg a week's extension\", \"convince her I'm not afraid\". Never a state\n(\"be angry\", \"feel guilty\") — states cannot be played directly. Behind the\nscene objective sits a super-objective — what the character wants across the\nwhole story; every scene objective is a step toward it.\n\n**2.2 Obstacle & stakes.** What prevents them from getting it — external\n(another character wants the opposite; witnesses in the room; two hours to\ndeadline) or internal (pride won't let them beg; they don't believe their\nown words). Stakes: the higher the cost of failure, the more taut the scene.\nAlways answer \"what happens if I do NOT get what I want?\" — the answer must\nfrighten the character.\n\n**2.3 Tactics.** The concrete method of pursuing the objective right now.\nTactics are action verbs: to press, to charm, to shame, to plead, to\nprovoke, to bargain, to threaten, to stall. When a tactic fails, a living\nperson CHANGES it. Dead acting is one tactic for the whole scene.\n\n**2.4 Beats.** The beat is the smallest unit of action: the stretch during\nwhich the character wants one thing and pursues it one way. A beat ends\nwhen: the objective is achieved, the tactic fails, new information arrives,\nor the balance of power shifts. **Every beat change must be VISIBLE in\nbehavior**: a pause, a change of posture, a change of speech tempo, a shift\nof gaze. A good scene has 2–4 beat changes; if behavior is unchanged for the\nwhole duration, the scene is played flat.\n\n**2.5 Subtext.** What the character actually thinks and wants, as opposed to\nwhat they say. Subtext is NOT performed — it leaks out on its own when the\ncharacter plays the true objective while speaking the false text. Markers\nyou can build into a scene: questions that aren't questions; repetitions\n(asking the same thing — doesn't believe the answer); abrupt topic changes;\njokes at the wrong moment (shield against vulnerability); answers that are\ntoo short (\"Fine.\" \"Sure.\" — a closed door).\n\n## 3. Listening and reaction — the main test of quality\n\nPerformance lives not in the lines but BETWEEN them. Observable markers of\nreal listening you should write into scenes:\n\n1. **Reaction starts before the partner's line ends.** A person grasps the\n   point mid-phrase — the face and body already answer. A neutral face until\n   the end of the partner's line, then \"switching on\", is dead acting.\n2. **Thought before word.** Before answering a hard question there is a\n   micro-pause — the person visibly decides what to say. Instant answers at\n   uniform speed = memorized text, no life.\n3. **The assessment moment.** When something important happens (news,\n   threat, insult), the character needs time to digest it — from a fraction\n   of a second to a long pause. Cinema lives on close-ups of these\n   assessments: a face, a defocused gaze, the world swimming.\n4. **Contagion from the partner.** Tempo, volume and energy shift in\n   response to the partner: a shout is answered either with a counter-shout\n   or with pointed quiet — but answered, not continued over.\n\n## 4. The body: the character's physical life\n\n**4.1 Physical state before psychology.** The body tells the story before\nthe first line. Set these parameters for every character:\n\n- **Center of gravity:** high (chest, chin — confidence, aggression, status)\n  or low (shoulders, slouch — fatigue, fear, submission).\n- **Tempo:** fast/ragged (nervousness, stimulant energy) or slow/economical\n  (control, threat — the most dangerous people move least).\n- **Openness:** squared shoulders and open palms vs crossed arms, dropped\n  head, closed poses.\n- **Breath:** high and rapid (panic) vs low and slow (control). Breath is\n  the most honest indicator of state; a clenched breath = a clenched\n  performance. Sound and physics must match: someone who just ran cannot\n  speak on a steady voice.\n\n**4.2 Business — the physical task.** A character almost always needs a\nDOING: they don't \"have a conversation\", they fix an engine, count money,\ncook, wipe a glass — and talk over the top of it. Business kills fake\ntheatricality (the hands are busy with truth), creates scene rhythm (pauses\nfill with action), and generates subtext (HOW a person counts money says\nmore than the words). **The interrupted-action rule:** the strongest accent\nis when a character STOPS the business. If he was slicing bread and stopped\nat a phrase — the phrase became an event. Use the stop as punctuation.\n\n**4.3 Proxemics — distance as drama.** The distance between characters is a\nvisible graph of their relationship: intimate zone (under 0.5 m) — love or\nviolence, entering uninvited is aggression, a threat whispered 10 cm from a\nface is scarier than shouting across a room; personal (0.5–1.2 m) — trust;\nsocial (1.2–3.5 m) — business, wariness; public (3.5+ m) — alienation,\nhierarchy. Scene drama is often just the story of distance: who closes it,\nwho breaks it, who freezes. **A change of distance = a change of beat.**\n\n**4.4 Status — the invisible hierarchy.** Status is what you DO, not who\nyou are. High status: an immobile head, slow movements, long gazes, pauses\nbefore answering, taking up space, touching other people's things. Low\nstatus: fussing, frequent self-touching (face, hair), broken speech,\nfiller-laughter, asking permission with the eyes. The most interesting\nthings in performance are **status breaks**: the boss who shows fear for one\nsecond; the underling who suddenly stops smiling. A powerful scene shape:\nenter high and collapse, or enter low and flip the room.\n\n## 5. Speech: how good acting sounds\n\n- Rhythm is written in the text — deliver it precisely; fast ≠ mushy.\n- Overlaps are normal (lines stepping on each other's tails), but key words\n  stay clean.\n- **Volume contrast: the most frightening things are said the quietest.**\n  Shouting is the currency of the weak; the character who owns the scene\n  lowers the volume and everyone leans in.\n- Pauses are events, not holes: a pause is legal only if something happens\n  inside it (an assessment, a decision, a refusal to answer).\n- Real speech has litter: interruptions, half-heard words, repetitions,\n  unfinished phrases. Perfectly constructed sentences kill street truth.\n\n---\n\n# PART II — WRITING THE ACTING: PROMPT ARCHITECTURE\n\n## 6. The character acting master profile\n\nEvery recurring character gets ONE master profile — the permanent source of\ntruth about how they act. It is written once, then adapted per scene (see\nsection 8). Target length: **150–220 words, one flowing paragraph**, all in\nEnglish, fully observable and filmable.\n\n**The template (block order is fixed):**\n\n```\nCharacter acting as [NAME]. [Age, build, physique, posture — the body as a\ndocument of their biography]. [The psychological engine in one clause — the\ninner drive that explains the physicality]. Vocal profile: [pitch/timbre,\naccent/origin, pace and delivery manner, and how the voice breaks or shifts\nunder emotion]. Key physical habits and tics: [signature tic with its\ntrigger; stress tic with its trigger; concealment behavior — what they do\nto hide what they feel; the facial mask and the exact condition under which\nit cracks]. Walking style: [the gait as characterization — named and\nspecific, with weight, rhythm and foot placement]. However, when [emotional\ntrigger], [the transformation — how the posture, gait and face change].\n[Optional: the softening target — the one person or thing that makes the\nface genuinely soften].\n```\n\n**Rules for writing each block:**\n\n1. **Only observable behavior.** Every inner state must have a body marker.\n   Never write \"he is nervous\" — write the trembling lower lip, the heavy\n   swallow, the long inhale through the mouth and sharp exhale through\n   pursed lips.\n2. **Every tic has a trigger.** Not \"he cracks his knuckles\" but \"he cracks\n   his knuckles during mundane conversations to fake confidence\". Format:\n   [tic] + [when/why]. Tics without triggers are decoration; tics with\n   triggers are dramaturgy.\n3. **Name the gait.** A memorable coined name inside quotes anchors the\n   biomechanics: a \"power-walk\", a \"peacock strut\", a \"gallery walk\", a\n   \"battering-ram stride\", a \"dreadnought pace\". Then unpack it: weight,\n   step, what the torso and arms do, what the head does.\n4. **Build in the mask AND the crack.** The single most cinematic device in\n   a profile is the conditional transformation: the facade and the precise\n   trigger that collapses it. A dominant swagger that crumbles into a\n   childlike slouch when rejected; a booming loudmouth whose face flashes\n   panicked inadequacy when family is mentioned; stern discipline that\n   melts into a radiant smile at one specific person. **Every profile\n   carries at least one \"However, when X — ...\" clause.** A character\n   playing two truths at once is the difference between a puppet and a\n   person.\n5. **One softening target.** Where it fits the character, give the face\n   exactly one person, animal or object for which it genuinely softens.\n   One — not two. This humanizes without diluting.\n6. **No wardrobe.** Clothing and costume live in the scene/look block of\n   the prompt, never in the acting profile. The profile must survive any\n   costume change.\n7. **No camera, no color.** Acting drives performance, face, voice and\n   motion only. Camera, grade and light live elsewhere in the prompt.\n8. **Physique carries biography.** Age, build and posture are chosen to\n   tell the backstory: a build \"weathered from past struggles\", shoulders\n   \"perpetually tense\", a posture \"over-corrected to project authority\".\n   The body is a document — profession, past injuries and self-image must\n   be readable in it.\n\n## 7. Eye life — mandatory in every profile and every scene\n\nDead eyes are the number-one tell of AI-generated acting. Give every\ncharacter continuous, naturalistic ocular life:\n\n- **Micro-saccades and gaze targeting** on whoever or whatever they attend\n  to; the gaze keeps moving — eyes drift, flick away in thought, scan to a\n  detail and settle back. They never lock frozen on a single point.\n- **Realistic blink rate and quality**, tied to state: rapid blink-bursts\n  under stress; slow calm lids in control; a blink-and-glaze on a moment of\n  dissociation.\n- **Live catchlights** — the eyes must read as wet, lit and alive.\n- **Controlled stillness is chosen, never dead.** If a character's register\n  is a near-unblinking predator calm, keep blinks rare, slow and\n  deliberate — a decision, not a freeze — and let the gaze still shift\n  slowly with intent.\n- **Eyes lead the thought.** The eyes reach the target a touch before the\n  head turns. Thought is readable in the eyes before the words come.\n- **Eye life reacts to the beat** like every other behavior: blink rate,\n  gaze steadiness and catchlight warmth all shift when the beat shifts.\n\n## 8. Scene adaptation — the master profile is rewritten, never pasted\n\nThe master profile is who the character IS. For each scene, REWRITE it into\nthe moment:\n\n1. **Present characters only.** Write an acting paragraph only for\n   characters actually in the shot. No character in frame → no paragraph.\n2. **Keep the constant core.** Identity, vocal profile, signature tics, eye\n   life and the emotional through-line stay the same in every scene — this\n   is what holds the character consistent across cuts. Never contradict the\n   master.\n3. **Re-express for this scene.** Select, emphasize, modify or drop\n   specific behaviors to fit the scene's posture (seated / standing /\n   running / hiding), action and beat, emotional state, and time of day.\n4. **Transform, don't delete.** A behavior that physically can't happen in\n   this scene is converted, not removed: a restless pacer slumped on a sofa\n   keeps the same nervous engine displaced into restless micro-sway,\n   wrist-flicks and paper-tearing. The energy is constant; its outlet\n   changes.\n5. **One flowing paragraph.** Fold the adaptation into prose in the\n   character's register — no bullet lists, no headers, no \"dial\" lines\n   inside the prompt.\n6. **Lead with the character's reference tag** if your pipeline uses asset\n   references, so the model binds the acting to the right person.\n\n## 9. Voice: fixed identity, never adapted\n\nActing is rewritten per scene; **voice is locked**. Each character gets one\nVoice prompt — their permanent vocal identity. When the character has a\nspoken line, paste the Voice prompt VERBATIM into the audio/voice field of\nthe prompt. Never modify it per scene. If the character appears but says\nnothing, omit it.\n\n**Voice prompt formula (1–2 sentences, quoted):**\n\n```\n\"A [age]-year-old [origin / accent descriptor]. [Timbre and register];\n[pace and delivery manner]; [emotional character — and how it shifts under\npressure].\"\n```\n\nThe vocal profile INSIDE the acting paragraph describes how speech behaves\ndramatically (tempo shifts, breaking registers, whispers); the Voice prompt\nin the audio field locks the sound itself. Both must agree with each other.\n\n## 10. States, not transitions\n\nVideo generation models fail transitions and nail states. Describe\ncharacters already IN the action state — mid-throw, mid-punch, mid-pace,\nmid-argument — not the process of getting there (\"reaches into the bag,\npulls out, winds up\" collapses; \"mid-throw, arm extended\" lands). Chain\nstates beat by beat instead of narrating continuous processes.\n\n## 11. Ensemble and space\n\n- **Group reactions travel in a wave, never in sync.** One person gets the\n  joke first, the second half a beat later, the third not at all.\n  Simultaneous identical reactions read as fake (unless a deliberately\n  choreographed comic sync is the point).\n- **The reaction is worth more than the action.** After every event, the\n  most valuable frame is the face of the person who saw it.\n- **Freeze at the threat.** Constant ensemble micro-movement — shifting\n  weight, gesturing, leaning — and at the key threat everything STOPS. The\n  contrast of bustle → stillness is punctuation.\n- **Movement = motivation.** Nobody crosses a room without an inner\n  impulse: toward something or away from something. Strong motivated\n  events: closing in (escalation), turning one's back (dismissal or\n  hiding the face), standing while the other sits (dominance grab),\n  sitting down mid-conflict (paradoxical power), stopping in the doorway\n  (the threshold = the decision point), starting to pack (ultimatum by\n  body).\n- **The strong are still and quiet; the weak fidget and shout.** Danger is\n  played not by the dangerous one but by the tension of everyone around\n  them. Threat without wind-up: no menacing pauses, no slow-motion turns —\n  in a truthful world violence arrives without an announcement.\n- **Degradation accumulates.** If a character is worn down across a story,\n  carry it in the body cumulatively — greyer, heavier, slower reactions —\n  never resetting between scenes.\n\n---\n\n# PART III — QUALITY CONTROL\n\n## 12. Atlas of bad acting — recognize and fix in the prompt\n\n| # | Symptom | How it looks | Prompt-level fix |\n|---|---|---|---|\n| 1 | Indication (mugging) | The face \"depicts\" the emotion: arched brows, grimaces | Remove the face from the task; write the objective and give the hands business |\n| 2 | Playing the result | The character plays the scene's outcome from second one | Write only what the character knows NOW |\n| 3 | Waiting for the cue | Empty face while the partner speaks | Write the reaction starting mid-line of the partner |\n| 4 | Monotactics | One color for the whole scene (all shouting / all whining) | Mark the beats; a new tactic verb for each |\n| 5 | Gesture illustration | Gesture duplicates the word (\"big\" — arms spread) | Gesture either precedes the thought, contradicts the words, or is absent |\n| 6 | Free emotion | Tears/rage with no build-up and no trigger event | Build the ladder: restraint → break; emotion must cost something |\n| 7 | Body false to biography | A thug with a dancer's posture; an addict with fresh plasticity | Set the body profile: center of gravity, tempo, wear |\n| 8 | Speech too clean for the class | A street character speaking in literary periods | Litter the speech: interruptions, dropped endings, repeats |\n| 9 | Threat signaling | \"Menacing\" pauses, squints, slow turns before violence | Threat is mundane; violence without wind-up |\n| 10 | Synchronized ensemble | Everyone reacts identically and at once | Stagger reactions in a wave, vary their strength |\n| 11 | Dead pauses | Silence in which nothing happens | Fill with assessment or business — or cut |\n| 12 | Emotional reset | The character instantly \"recovers\" after a strong event | States have inertia; the trail carries into the next beat |\n| 13 | Commenting the role | The performance winks at the viewer (\"we both know this is funny\") | Full belief in the circumstances; comedy is played dead serious |\n| 14 | Close-up overload | Active mimicry on a close-up | The tighter the shot, the less movement: only the eyes and the thought |\n| 15 | Dead eyes | Frozen stare, no blinks, no saccades, glassy catchlights | Apply section 7 in full — eye life is never optional |\n\n## 13. The performance scale (self-check)\n\n- **0 — Mannequin.** Text delivered, behavior absent.\n- **1 — Declaimer.** \"Expressive\" text, indicated emotions, illustrating body.\n- **2 — Diligent.** An objective can be guessed, but one tactic, late reactions, empty pauses.\n- **3 — Craftsman.** Objective and beats present, listens to the partner, body makes sense. Missing: subtext, surprising tactics, inertia of states.\n- **4 — Alive.** Continuous behavior, contrasting tactics, subtext diverging from text, status in the body, reactions ahead of lines, at least one unexpected-but-true choice.\n- **5 — Magnet.** All of \"4\" plus paradox: the character combines incompatibles — funny and frightening, cruel and charming, lying and touching. **The two-truths rule: at level 5 the character always plays TWO truths simultaneously** (helps — and hates it; apologizes — and defends; loves — and has already left). One clean emotion without contradiction reads as synthetic on a close-up.\n\nAim every hero shot at 4+; a paragraph that self-checks at 2 or below gets\nrewritten before it ships.\n\n## 14. Pre-send checklist\n\n- [ ] Objective as a verb aimed at a partner — for every character in frame\n- [ ] Obstacle and stakes exist; the cost of failure is real\n- [ ] 2–4 beat changes, each visible in behavior (pause / posture / tempo / gaze)\n- [ ] Reactions begin before the partner's lines end; assessment moments present\n- [ ] Every character has business; the interrupted-action accent is used deliberately\n- [ ] Distances change and the changes are motivated; status is in the body, not just the words\n- [ ] All tics carry triggers; the mask has its crack (\"However, when X...\")\n- [ ] Eye life written explicitly: saccades, blink quality, catchlights, eyes-lead-thought\n- [ ] Voice prompt pasted verbatim if the character speaks; omitted if silent\n- [ ] States not transitions; no wardrobe, camera or color inside the acting\n- [ ] Ensemble reactions staggered; strong = still, weak = fidgety\n- [ ] Scale check: would this paragraph score 4+?\n\n---\n\n# PART IV — WORKED EXAMPLE (invented character, use as a pattern)\n\n## 15. Master profile\n\n```\nCharacter acting as VIKTOR. Early 60s male, a retired night-shift taxi\ndriver and former amateur boxer; heavy, thick-necked build gone soft at the\nmiddle, with a flat-nosed face and old scar tissue over both eyebrows; sits\nand stands with a low, grounded center of gravity, weight always on the\nwhole foot. Runs on a single engine: decades of waiting — for fares, for\nrounds, for trouble — have made patience his weapon. Vocal profile: low,\nhoarse, unhurried baritone with a working-class rasp, short sentences\ndelivered flat and economical, dropping to a slower, quieter register the\nmore serious things get — he never speeds up. Key physical habits and tics:\nrolls an old coin across his knuckles when sizing a situation up; a slow,\naudible nose-breath before he says no; when lying is happening in front of\nhim, he goes completely still and lets a long silence do the pressing; his\ndefault face is a heavy-lidded, bored mask that conceals total attention.\nEye life: sleepy, hooded eyes with slow deliberate blinks and constant\nquiet scanning — mirrors, hands, exits — the gaze settling on a speaker a\nbeat before his head turns; catchlights low but alive. Walking style: a\nheavy, rolling \"old boxer's walk,\" short economical steps, shoulders level,\nhands loose and ready, never hurrying. However, when someone raises a hand\nnear him, the sleepy mask vanishes in a half-second: the chin drops, the\nhands rise halfway, the feet find their old stance — then he catches\nhimself and folds it away, embarrassed. His face only truly softens for\nstray dogs, which he feeds from his coat pocket.\n```\n\n**Voice (paste verbatim when VIKTOR speaks):** \"A 60-year-old ex-boxer and\nnight-cab driver, working-class city accent. Low, hoarse, unhurried\nbaritone; short flat economical sentences with long comfortable pauses;\ncalm and faintly amused, going quieter — never louder — as things get\nserious.\"\n\n## 16. Scene adaptation example\n\nScene: VIKTOR sits in his parked cab at night; a nervous young passenger in\nthe back seat is lying about having money for the fare.\n\n```\nVIKTOR sits motionless in the driver's seat, heavy and grounded, watching\nthe passenger in the rear-view mirror instead of turning around — his\nhooded eyes flick between the mirror, the passenger's hands and the door\nlock in slow, quiet scans, blinks rare and deliberate, the gaze settling\non the mirror a beat before his head ever moves. The old coin walks across\nhis knuckles on the seat-rest, unhurried; as the passenger's story falls\napart, the coin stops mid-roll — he lets the silence sit, takes one slow,\naudible breath through the nose, and answers in his low, hoarse baritone,\nflatter and quieter than before, never speeding up. Only when the kid's\nvoice cracks does the sleepy mask ease a fraction: a long exhale, a slow\nblink, the coin resuming its roll — patience choosing, for now, to be\nkind.\n```\n\nWhat happened here: the walk is irrelevant (seated) so its energy moved\ninto stillness and the coin; the signature tics kept their triggers (coin =\nsizing up, stopped coin = interrupted action as punctuation, nose-breath =\nrefusal, stillness + silence = pressure on a liar); the eye life obeys the\nmaster but is re-targeted to mirror, hands, lock; the beat changes are\nvisible (coin stops → silence → quieter voice → softening); the voice\nstayed untouched — it will be pasted verbatim into the audio field.\n\n---\n\n# FINAL AXIOMS\n\n1. Acting is behavior under pressure, not a demonstration of feelings.\n2. Listening matters more than speaking; reacting matters more than declaiming.\n3. Emotion is the consequence of a won or lost struggle, and it is expensive.\n4. The body is smarter than the words: when text and body conflict, the viewer believes the body.\n5. The strong are still and quiet; the weak fuss and shout. Exceptions are events.\n6. Every tic needs a trigger; every mask needs a crack.\n7. Every scene is somebody's defeat. If nobody lost, there was no scene.\n8. Subtext is not shown — it fails to be hidden.\n9. States, not transitions; the model films what is, not what becomes.\n10. When in doubt — cut. Less acting = more truth.\n";

const $  = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hash = s => { let h=0; for(let i=0;i<String(s).length;i++) h=(h*31+String(s).charCodeAt(i))|0; return Math.abs(h); };
function ph(label, w=400, h=225){
  const H = hash(label) % 360;
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='"+w+"' height='"+h+"'>"
    + "<defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>"
    + "<stop offset='0' stop-color='hsl("+H+",42%,30%)'/>"
    + "<stop offset='1' stop-color='hsl("+((H+48)%360)+",52%,15%)'/></linearGradient></defs>"
    + "<rect width='"+w+"' height='"+h+"' fill='url(#g)'/>"
    + "<text x='"+w/2+"' y='"+(h/2+5)+"' font-family='sans-serif' font-size='14' fill='rgba(255,255,255,.6)' "
    + "text-anchor='middle'>"+esc(label)+"</text></svg>";
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function phFallback(el){
  if (el.dataset.fb) return; el.dataset.fb = '1';
  el.src = ph(el.dataset.ph || 'Asset');
}
const srcOf = (src, label) => src || ph(label);
/* video 加载失败时退化为 poster / 占位图 */
function vidFallback(v){
  const img = document.createElement('img');
  img.dataset.ph = v.dataset.ph || 'Clip';
  img.src = v.dataset.poster || '';
  img.onerror = function(){ phFallback(img); };
  if (!img.src) phFallback(img);
  v.replaceWith(img);
}
let toastTimer;
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg;
  t.className = 'toast show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.className='toast'; }, 2200);
}

  'd01': "# 蛾仙选祭录 · 分场剧本\n\n## 场景 1 · EXT. 山村晒场 - 清晨\n\n`scene_001`\n\n**第一段：她被选中（0–30 秒）**\n\n浓雾罩住山村晒场，成串白色蚕茧从木架上垂落，在风里轻轻晃动。远处的铜铃挂在雾中。\n\n村民整齐跪在祭台前，每人把一枚空蚕茧捧在心口。他们同时抬头，望向祭台前方。\n\n一只布满细小纹路的手把干枯的蛾翅递给阿绣。阿绣接过蛾翅，低头看着它，烛火映在她眼里。她用指尖碰了碰翅膀边缘，少量鳞粉留在指纹上。\n\n阿绣抬头，将蛾翅放入口中吞下。她闭上眼，喉咙轻轻一动；再次睁眼时，眼里的烛火微弱地跳了一下。\n\n## 场景 2 · INT. 阿绣的屋子 - 夜\n\n`scene_002`\n\n**第二段：她在变化（30–60 秒）**\n\n阿绣独自坐在床边，油灯发出幽绿的微光。她摸向颈侧，皮肤下浮起一层细密鳞纹。她凑近油灯查看，脸上露出安静的欣喜。\n\n她抬起手腕，无意识地抽出一缕湿润的白丝。丝线越拉越长，缠住她的手腕，在皮肤上留下浅浅的勒痕。\n\n**画外音**  （画外）\n\n> 再等等……我马上就能……\n\n屋外传来遥远、模糊的吟唱。阿绣侧耳倾听，眼神慢慢失焦。她眼中映出的烛火变成两点微弱的幽蓝光。\n\n阿绣穿着蓝色绣花鞋站起身，朝门外的夜雾走去。\n\n## 场景 3 · EXT. 山村祭台 - 夜\n\n`scene_003`\n\n**第三段：她走进茧（60–90 秒）**\n\n祭台中央悬着一枚巨大的人形蚕茧。冷雾围住祭台，一束微弱顶光落在茧壳上。村民围在四周，手里举着蓝色蜡烛，安静地看着阿绣。\n\n阿绣穿着蓝色绣花鞋走向祭台。村民无声地让出一条路。她经过人群时回头看了一眼，空洞微笑。\n\n阿绣躺进人形蚕茧。湿丝从茧壁缓慢伸出，先缠住她的手，再覆过胸口。她一直望着上方的微光。\n\n丝线接近她的眼睛时，阿绣忽然睁大双眼。湿丝覆住她的视线，茧口缓缓合拢。\n\n## 场景 4 · EXT. 山村晒场 - 记忆，浓雾\n\n`scene_004`\n\n**第四段：姐姐留下的鞋（90–106 秒）**\n\n画面从黑暗中浮出。幼年阿绣穿旧浅色布衣，低头看见姐姐把一双小小的蓝色绣花鞋放进她怀里。姐姐只露出温柔的手、旧衣袖和模糊侧影，脸始终被雾遮住。\n\n幼年阿绣穿上蓝色绣花鞋，在湿石地上追赶姐姐。姐姐背对她走进浓雾，垂落的白色茧丝一点点遮住姐姐的衣角和背影。\n\n雾深处出现模糊的非人暗影，只有湿润反光的局部轮廓。幼年阿绣停在原地，伸手去抓姐姐，却只抓到一缕飘散的白色茧丝。浓雾遮住整个画面。\n\n## 场景 5 · EXT. 山村晒场 - 深夜\n\n`scene_005`\n\n**第五段：茧壳与空鞋（106–136 秒）**\n\n夜雾中的人形茧壳静静悬在祭台上。过了一会儿，茧体内部出现极轻的起伏。湿丝缝隙间偶尔透出一线暗金色微光，又很快熄灭。村民缓慢抬头。\n\n茧壳中央的湿丝无声松开，裂口缓慢向两侧分开。雾中掠过几只模糊的蛾影，零散的鳞粉在冷光里飘落。村民仰头跪下，脸上露出虔诚而僵硬的笑。\n\n雾再次漫过晒场。茧壳下出现一道背对镜头的身影：双辫在夜风里轻晃，颈肩有细密鳞纹，背后垂着两片尚未展开的湿翼。她没有回头，轮廓逐渐融进夜色。\n\n一枚空蚕茧从她脚边滚出，停在一只蓝色绣花鞋旁。几粒鳞粉落在鞋面上，雾慢慢遮住远处的人影。\n",
  'd02': "# 蛾仙选祭录 · 剧本分析\n\n## 故事梗概\n\n古代山村中，年轻村女阿绣被选中，在木然村民的注视下吞下干枯蛾翅。她对身体变化生出欣喜，却逐渐被鳞纹、湿丝与遥远吟唱牵引，走向祭台上的人形蚕茧；直到丝线遮眼，她才骤然惊觉。姐姐赠予蓝色绣花鞋、随后消失于浓雾的童年记忆插入，映照眼前的失去。茧壳裂开后，一道带湿翼的双辫背影隐入夜色，只留下空茧与绣花鞋，以安静压抑的方式呈现仪式许诺与自我消失之间的冲突。\n\n## 类型定位\n\n- 主类型：民俗恐怖\n- 副类型：志怪奇幻 / 悬疑\n- 关键词：古代山村、选祭仪式、异化、蚕茧、姐妹记忆\n\n## 全局影像风格\n\n国风写实的古代中式山村民俗恐怖影像，以潮湿浓雾中的晒场、祭台和旧屋构成乡村空间；低饱和青绿色冷调统领画面，幽绿灯火、幽蓝光点与暗金微光局部点缀，保持中等对比。采用轻微胶片颗粒、中等锐度与高动态范围保留暗部湿丝及旧织物细节，以低调光统摄雾中漫射日光、油灯烛火和微弱顶光的混合光质，持续营造安静、压抑、克制而诡异的氛围；不出现现代物件、字幕、文字、水印、血腥画面或完整怪物。\n\n### 视觉风格\n\n以国风写实表现中式山村志怪民俗，依靠局部异化细节和遮蔽的怪异轮廓建立恐怖感，不展示血腥或完整怪物。\n\n- 关键词：国风写实、中式民俗、志怪、局部异化、遮蔽表达\n\n### 色彩\n\n低饱和青绿色冷调主导，以幽绿灯火、幽蓝光点和暗金微光作局部点缀，中等对比维持雾层与暗部细节。\n\n- 色板：青绿色为主，幽绿、幽蓝与暗金局部点缀\n- 色温：整体偏冷，局部暗金微暖\n- 饱和度：低\n- 对比度：中\n\n### 影像质感\n\n轻微胶片颗粒与中等锐度保留皮肤鳞纹、湿丝和旧织物的真实质感，高动态范围兼顾低照度暗部与微弱发光细节。\n\n- 胶片颗粒：轻微\n- 锐度：中等\n- 动态范围：高\n\n### 光线基调\n\n整体采用低调光，雾中漫射日光、幽绿油灯与烛火、蓝色蜡烛及微弱顶光构成混合光质，局部暗金微光短暂显露而不照亮全部异形。\n\n- 用光：低调光\n- 光源：雾中日光、油灯、烛火、微弱顶光、茧内暗金微光\n- 光质：混合\n\n### 世界环境\n\n古代中式乡村环境，由潮湿多雾的山村晒场、祭台与阿绣旧屋组成，不出现现代物件。\n\n- 时代：古代\n- 环境：乡村\n\n### 情绪\n\n以安静、压抑、克制的仪式进程持续积累诡异感，阿绣短暂的欣喜与姐姐记忆中的温柔反衬最终的失去。\n\n- 关键词：安静、压抑、克制、诡异、失落\n",

FILES.push({ id:'outro', folder:'outro', name:'片尾 · 黑屏转文字动画',
  type:'video', video:'assets/shot7定稿.mp4', src:'assets/posters/shot7定稿.webp', dur:'0:10',
  prompt:'黑屏转文字，显现游戏logo和副本标题。古风悬疑设计。音效：粘稠的蚕丝声效。文字内容：无明春山 xumi。@image:shot7尾帧图.png',
  refs:['shot7尾帧图'],
  model:'Seedance 2.5', aspect:'16:9', size:'1280×720', created:DAY });


/* [编辑区 4] 左侧文件树：按 00→05 生产流程分层的多层级目录
 * 节点字段：id / name / children(子目录) / note(标题补充) / plan(空目录的规划内容)
 * 计数 = 该目录及其所有子目录下的素材总数，自动统计，不用手填。
 * 视频子目录的 id 沿用 SHOT_FILES 的 shot 编号，显示名按 scene-beat-shot 规范命名。
 */
const TREE = [
  { id:'00', name:'00_原始资产', children:[
      { id:'00-script', name:'原始剧本' },
      { id:'00-ref',    name:'参考素材', plan:'参考图 / 参考风格 / 参考导演' }
  ]},
  { id:'01', name:'01_结构化分析' },
  { id:'02', name:'02_生成资产', children:[
      { id:'02-img', name:'主体图片', children:[
          { id:'02-img-char', name:'人物' },
          { id:'02-img-prop', name:'道具' },
          { id:'02-img-loc',  name:'场景' }
      ]},
      { id:'02-keyframe', name:'关键帧' },
      { id:'02-video', name:'视频',
        children: FINAL_SHOTS.map(x => ({ id:x.id, name:x.id, note:x.note }))
          .concat([{ id:'outro', name:'片尾', note:'黑屏转文字 · 成片收尾' }]) },
      { id:'02-audio', name:'音频' }
  ]},
  { id:'03', name:'03_测试材料', plan:'风格 / 色彩 / 光照 / 主体 / 分镜 的测试素材' },
  { id:'04', name:'04_未采用素材', note:'生成后未采用 / 有瑕疵的版本' },
  { id:'05', name:'05_成片' }
];

/* 扁平化索引：depth 供缩进，descendantIds 让父目录能汇总所有子目录的素材 */
const NODE_MAP = {};
(function walk(list, depth){
  list.forEach(n => {
    n.depth = depth;
    NODE_MAP[n.id] = n;
    if (n.children) walk(n.children, depth + 1);
  });
})(TREE, 0);
const nodeById = id => NODE_MAP[id] || null;
function descendantIds(id){
  const n = NODE_MAP[id];
  if (!n || !n.children) return [id];
  return [id].concat(n.children.reduce((a, c) => a.concat(descendantIds(c.id)), []));
}
const filesIn = fid => {
  if (fid === 'all') return FILES;
  const ids = descendantIds(fid);
  return FILES.filter(f => ids.indexOf(f.folder) >= 0);
};
const findFile = id => FILES.find(f => f.id === id);

function renderTree(){
  const row = n => {
    const kids = n.children && n.children.length;
    const open = state.open[n.id] !== false;
    const cnt = filesIn(n.id).length;
    const label = n.note ? n.name + ' · ' + n.note : n.name;
    return '<div class="titem'+(state.folder === n.id ? ' on' : '')+'"'
      + ' data-act="tree" data-id="'+esc(n.id)+'"'
      + ' style="padding-left:'+(10 + n.depth * 14)+'px" title="'+esc(label)+'">'
      + (kids
          ? '<span class="tw" data-act="twist" data-id="'+esc(n.id)+'">'+(open ? '▾' : '▸')+'</span>'
          : '<span class="tw blank"></span>')
      + '<span class="tl">'+esc(n.name)+'</span>'
      + (cnt ? '<span class="tc">'+cnt+'</span>' : '')
      + '</div>'
      + (kids && open ? n.children.map(row).join('') : '');
  };
  $('#tree').innerHTML =
    '<div class="tproj"><div class="tav"><img src="'+esc(PROJECT.cover)+'" onerror="phFallback(this)" alt=""></div>'
    + '<div class="tn"><b>'+esc(PROJECT.name)+'</b><i>'+esc(PROJECT.subtitle)+'</i></div></div>'
    + '<div class="titem'+(state.folder==='brief'?' on':'')+'" data-act="tree" data-id="brief">'
    +   '<span class="ico">📄</span><span class="tl">Project brief · 项目信息</span></div>'
    + '<div class="titem'+(state.folder==='all'?' on':'')+'" data-act="tree" data-id="all">'
    +   '<span class="ico">✦</span><span class="tl">All assets · 全部</span>'
    +   '<span class="tc">'+FILES.length+'</span></div>'
    + '<div class="thd">Folders</div>'
    + TREE.map(row).join('')
    + '<div class="tfoot">Xumi Story. · '+PROJECT.stats.shots+' 组镜头 · '+FILES.length+' 个素材'
    +   '<br>按 00→05 生产流程归档</div>';
}

/* 工作台内的「项目信息」面板：版心居中的编辑式长文，不切换视图 */
function renderStudioBrief(){
  const P = PROJECT, ST = P.story, SK = P.skillFile;
  $('#farea').classList.add('briefmode');

  const csec = (no, tag, title, body, extra) =>
    '<div class="csec'+(no?'':' first')+'">'
    + '<div class="stag">'+esc(no ? no+' · '+tag : tag)+'</div>'
    + (title ? '<h2>'+esc(title)+'</h2>' : '')
    + '<div class="cbody">'+(Array.isArray(body) ? body.map(p => '<p>'+esc(p)+'</p>').join('')
        : '<p>'+esc(body)+'</p>')+'</div>'
    + (extra || '') + '</div>';

  const miniwall = '<div class="miniwall">'
    + SUBJECTS.map(x => '<div class="mini"><img src="'+esc(x.src)+'" data-ph="'+esc(x.name)
      + '" onerror="phFallback(this)" alt=""><span>@'+esc(x.name)+'</span></div>').join('')
    + '</div>';

  const apair = id => {
    const x = SUBJECTS.find(a => a.id === id);
    if (!x) return '';
    return '<div class="apair"><div class="apimg"><img src="'+esc(x.src)+'" data-ph="'+esc(x.name)
      + '" onerror="phFallback(this)" alt=""></div>'
      + '<div class="aptxt"><b>'+esc(x.name)+'</b><span class="at">@'+esc(x.name)+'</span>'
      + '<div style="margin-top:6px">'+esc(ST.assetNotes[id] || '')+'</div>'
      + '<details><summary>查看完整 descriptor</summary><pre class="code">'+esc(x.prompt)+'</pre></details>'
      + '</div></div>';
  };

  const prefix = SP1.draft.split('\n')[0];
  const styleBlock = '<pre class="code">'+esc(prefix)+'</pre>';
  const shotImg = '<div class="shotimg"><img src="assets/shot4首帧图.webp" alt="">'
    + '<div class="cap">shot4 · 首帧分镜图（湿丝封茧）</div></div>';
  const final2Block = '<pre class="code">'+esc(SP1.final2)+'</pre>';
  const skillCard = '<div class="skill" style="margin-top:16px"><div class="sicon">MD</div>'
    + '<div class="sbody"><b>'+esc(SK.name)+'</b><i>'+esc(SK.note)+' · '+esc(SK.size)+' · '+SK.lines+' 行</i>'
    + '<div class="sacts"><a class="sbtn pri" href="'+esc(SK.file)+'" download="'+esc(SK.name)+'">⬇ 下载 .md</a></div>'
    + '</div></div>';
  const player = '<div class="film"><video controls preload="metadata" playsinline poster="'+esc(P.cover)+'">'
    + '<source src="'+esc(MP4)+'" type="video/mp4"></video></div>'
    + '';

  const tools = '<div class="toolbox"><span class="tl">The tools</span><ul>'
    + ST.tools.map(t => '<li><b>'+esc(t.name)+'</b>（'+esc(t.use)+'）</li>').join('')
    + '</ul></div>';

  $('#farea').innerHTML =
    '<div class="stbrief">'
    + '<div class="fhead"><b>项目基础信息</b><span>'+esc(P.name)+'</span><span class="sp"></span></div>'
    + '<div class="bhead"><div class="updated">Updated '+esc(ST.updated)+'</div>'
    +   '<h1>'+esc(P.name)+'</h1><div class="sub">'+esc(P.subtitle)+'</div>'
    +   '<div class="logline">'+esc(ST.logline)+'</div></div>'
    + '<div class="bcover"><img src="'+esc(P.cover)+'" data-ph="'+esc(P.name)
    +   '" onerror="phFallback(this)" alt=""></div>'
    + csec('', 'About the project', '', ST.about, tools)
    + csec('01', 'PRE-PRODUCTION', '资产', ST.c1, miniwall + apair('a-azxiu') + apair('a-shoes'))
    + csec('02', 'PRE-PRODUCTION', '风格锁在提示词里', ST.c2, styleBlock)
    + csec('03', 'PRODUCTION', '分镜与版本迭代', ST.c3, shotImg + final2Block)
    + csec('04', 'PRODUCTION', '跨镜锚点与表演层', ST.c4, skillCard)
    + csec('05', 'PRODUCTION', '成片', ST.c5, player)
    + '</div>';
}

function renderFiles(){
  if (state.folder === 'brief'){ renderStudioBrief(); return; }
  $('#farea').classList.remove('briefmode');
  const list = filesIn(state.folder);
  const meta = nodeById(state.folder) || { name: state.folder === 'all' ? 'All assets · 全部' : state.folder };
  const title = meta.note ? meta.name + ' · ' + meta.note : meta.name;
  $('#farea').innerHTML =
    '<div class="fhead"><b>'+esc(title)+'</b><span>'+list.length+' 个文件</span><span class="sp"></span>'
    + '<span>点击文件查看详情</span></div>'
    + (list.length
      ? '<div class="fgrid">' + list.map(f =>
          '<div class="fcard" data-act="file" data-id="'+f.id+'">'
          + (f.type === 'audio'
              ? '<div class="th faudio"><span class="aico">♫</span><span class="dext">'+esc(f.ext)+'</span>'
                + '<span class="aname">'+esc(f.name)+'</span></div>'
              : f.type === 'doc'
                ? '<div class="th fdoc"><span class="dext">'+esc(f.ext)+'</span>'
                  + '<span class="dname">'+esc(f.name)+'</span></div>'
                : '<div class="th"><img src="'+esc(srcOf(f.src, f.name))+'" data-ph="'+esc(f.name)+'" onerror="phFallback(this)" alt="">'
                  + (f.type === 'video' ? '<span class="vtag">▶ ' + esc(f.dur || 'video') + '</span>' : '')
                  + '</div>')
          + '<div class="nm">'+esc(f.name)+'</div>'
          + '<div class="md">'+esc(f.type === 'doc' || f.type === 'audio' ? f.note : f.model+' · '+(f.aspect || '—'))+'</div></div>').join('') + '</div>'
      : '<div class="fempty">此文件夹暂无已上传素材'
        + (meta.plan ? '<div class="plan">规划内容：'+esc(meta.plan)+'</div>' : '')
        + '</div>');
}

/* =========================================================================
 * 7. 素材详情页：大图预览 + PROMPT（@主体高亮）+ DETAILS + Download
 * ========================================================================= */
const hl = (text, refs) => {
  let s = esc(text);
  (refs || []).forEach(r => { if (r) s = s.split(esc(r)).join('<span class="hl">@' + esc(r) + '</span>'); });
  return s;
};
const drow = (k, v) => '<div class="row"><span class="k">'+k+'</span><span class="v">'+esc(v || '—')+'</span></div>';

function renderDetail(){
  const f = findFile(state.file);
  if (!f) return renderFiles();
  $('#farea').classList.remove('briefmode');
  const isDoc = f.type === 'doc';
  const isAudio = f.type === 'audio';
  const isAssetDoc = isDoc || isAudio;
  const hasVideo = f.type === 'video' && f.video;
  $('#farea').innerHTML =
    '<div class="detail">'
    + '<div class="dmedia">'
    +   '<div class="dback" data-act="file-close">← 返回文件列表</div>'
    +   (isAudio
        ? '<div class="daudio"><div class="adisc">♫</div><div class="atitle">'+esc(f.name)+'</div>'
          + '<audio controls preload="metadata" src="'+esc(f.audio)+'"></audio></div>'
        : isDoc
          ? '<pre class="docfull">'+esc(f.text || '')+'</pre>'
          : hasVideo
            ? '<video id="dvid" src="'+esc(f.video)+'" poster="'+esc(srcOf(f.src, f.name))+'" autoplay muted loop playsinline></video>'
            : '<img src="'+esc(srcOf(f.src, f.name))+'" data-ph="'+esc(f.name)+'" onerror="phFallback(this)" alt="">'
              + (f.type === 'video' ? '<div class="novid">片段待生成（占位）</div>' : ''))
    +   '<div class="dbar">'
    +     (hasVideo
          ? '<span id="tcur">0:00</span><div class="track" id="dtrack"><i id="dfill"></i></div>'
          : '<span class="sp"></span>')
    +     '<span>'+esc(isDoc ? (f.lines+' 行 · '+f.size) : isAudio ? f.size : (f.dur || f.aspect || ''))+'</span></div>'
    + '</div>'
    + '<div class="dinfo">'
    +   '<div class="duser"><div class="dav">X</div><div class="dn"><b>xumi</b><i>Author</i></div>'
    +     '<span class="sp"></span><span class="dx" data-act="file-close">×</span></div>'
    +   '<div class="dsec"><span>'+(isAssetDoc ? 'FILE INFO' : 'PROMPT')+'</span><button class="cpy" data-act="copy">Copy</button></div>'
    +   '<div class="dprompt" id="dprompt">'+(isAssetDoc ? esc(f.note || '') : hl(f.prompt || '该版本的提示词未登记。', f.refs))+'</div>'
    +   '<div class="dsee" data-act="see-all">See all ↓</div>'
    +   '<div class="dsec" style="margin-top:12px"><span>DETAILS</span></div>'
    +   '<div class="dtable">'
    +     (isDoc
          ? drow('Type', f.ext)+drow('Lines', f.lines+' 行')+drow('Size', f.size)+drow('Created', f.created)
          : isAudio
            ? drow('Type', f.ext)+drow('Size', f.size)+drow('Created', f.created)
            : drow('Model', f.model)+drow('Aspect', f.aspect)+drow('Duration', f.dur)
              +drow('Size', f.size)+drow('Created', f.created))
    +   '</div>'
    +   '<span style="flex:1"></span>'
    +   '<button class="dl" data-act="download">⬇&ensp;'+(isAssetDoc ? '下载文件' : 'Download')+'</button>'
    + '</div></div>';
  const v = $('#dvid');
  if (v){
    const fill = $('#dfill'), tcur = $('#tcur'), track = $('#dtrack');
    const fmt = t => { t = Math.max(0, t | 0); return Math.floor(t/60) + ':' + String(t%60).padStart(2,'0'); };
    v.addEventListener('timeupdate', () => {
      if (v.duration){ fill.style.width = (v.currentTime / v.duration * 100) + '%'; tcur.textContent = fmt(v.currentTime); }
    });
    track.addEventListener('click', e => {
      if (!v.duration) return;
      const r = track.getBoundingClientRect();
      v.currentTime = (e.clientX - r.left) / r.width * v.duration;
    });
  }
  const au = document.querySelector('.daudio audio');
  if (au){
    const wrap = au.closest('.daudio');
    const on = () => wrap.classList.add('playing');
    const off = () => wrap.classList.remove('playing');
    au.addEventListener('play', on);
    au.addEventListener('pause', off);
    au.addEventListener('ended', off);
  }
}

function openFile(id){ state.file = id; renderDetail(); }
function closeFile(){ state.file = null; renderFiles(); }
function copyPrompt(){
  const f = findFile(state.file); if (!f) return;
  const isDoc = f.type === 'doc', isAudio = f.type === 'audio';
  const txt = isDoc ? (f.text || '') : isAudio ? (f.note || '') : (f.prompt || '');
  const done = () => toast(isDoc ? '文件全文已复制到剪贴板' : isAudio ? '音轨说明已复制' : '提示词已复制到剪贴板');
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done, () => toast('复制失败', true));
  } else {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); done();
  }
}

function downloadFile(){
  const f = findFile(state.file); if (!f) return;
  const url = f.video || f.audio || f.file || (f.src && !f.src.startsWith('data:') ? f.src : '');
  if (!url){ toast('演示占位：该文件待补齐后可下载', true); return; }
  const a = document.createElement('a');
  a.href = url; a.download = f.name.replace(/[\\/:*?"<>|]/g, '_'); a.click();
  toast('开始下载：' + f.name);
}

/* （原中栏预览 / 结果网格 / Generate 逻辑已按新文件树逻辑移除） */

/* =========================================================================
 * 8. 视图切换与事件
 * ========================================================================= */
function goto(v){
  state.view = v;
  $('#briefView').classList.toggle('hidden', v !== 'brief');
  $('#studioView').classList.toggle('hidden', v !== 'studio');
  if (v === 'studio') renderAll();
}
function renderAll(){
  $('#topName').textContent = PROJECT.name;
  renderTree();
  state.file ? renderDetail() : renderFiles();
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act;

  if (act === 'goto-studio'){
    state.folder = 'brief'; state.file = null; goto('studio'); return;
  }
  if (act === 'goto-home'){ goto('brief'); return; }
  if (act === 'goto-brief'){
    state.folder = 'brief'; state.file = null; renderTree(); renderFiles(); return;
  }
  if (act === 'play-final'){
    const v = $('#finalPlayer');
    if (v){ v.scrollIntoView({behavior:'smooth',block:'center'}); v.play().catch(()=>{}); }
    return;
  }
  if (act === 'skill-outline'){ const el = $('#skillOutline'); if (el) el.classList.toggle('open'); return; }
  if (act === 'skill-full'){ const el = $('#skillFull'); if (el) el.classList.toggle('open'); return; }
  if (act === 'ptoggle'){ t.classList.toggle('open'); return; }

  if (act === 'twist'){
    const id = t.dataset.id;
    state.open[id] = state.open[id] === false;
    renderTree();
    return;
  }
  if (act === 'tree'){
    state.folder = t.dataset.id;
    state.file = null;
    renderTree(); renderFiles();
    return;
  }
  if (act === 'file'){ openFile(t.dataset.id); return; }
  if (act === 'file-close'){ closeFile(); return; }
  if (act === 'copy'){ copyPrompt(); return; }
  if (act === 'see-all'){
    const p = $('#dprompt');
    if (p){ p.classList.toggle('open'); t.textContent = p.classList.contains('open') ? 'See all ↑' : 'See all ↓'; }
    return;
  }
  if (act === 'download'){ downloadFile(); return; }
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (state.view === 'studio' && state.file) closeFile();
  else if (state.view === 'studio') goto('brief');
});

/* 启动 */
renderBrief();
goto('brief');
</script>
